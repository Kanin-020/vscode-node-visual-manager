name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.2.3). Empty = bump patch from the last tag."
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false
      notes:
        description: "Additional notes for the changelog"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: node-visual-manager-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Resolve and bump version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            INPUT_VERSION="${INPUT_VERSION#v}"
            if ! echo "$INPUT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Invalid version: $INPUT_VERSION (use X.Y.Z format)"
              exit 1
            fi
            VERSION="$INPUT_VERSION"
          else
            LAST_TAG=$(git tag --sort=-v:refname | head -1)
            if [ -n "$LAST_TAG" ]; then
              LAST_TAG="${LAST_TAG#v}"
              MAJOR=$(echo "$LAST_TAG" | cut -d. -f1)
              MINOR=$(echo "$LAST_TAG" | cut -d. -f2)
              PATCH=$(echo "$LAST_TAG" | cut -d. -f3)
              VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            else
              VERSION="1.0.0"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Update package.json version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npx json -I -f package.json -e "this.version=\"$VERSION\""
          echo "Updated package.json to v$VERSION"

      - name: Generate CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -1)
          CURRENT_DATE=$(date +%Y-%m-%d)

          {
            echo "## [$VERSION] - $CURRENT_DATE"
            echo ""
            echo "### Changed"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges
            else
              git log --pretty=format:"- %s" --no-merges
            fi
            echo ""
          } > /tmp/changelog_section.md

          if [ -f CHANGELOG.md ]; then
            {
              head -n 5 CHANGELOG.md
              echo ""
              cat /tmp/changelog_section.md
              tail -n +6 CHANGELOG.md
            } > CHANGELOG.md.new
            mv CHANGELOG.md.new CHANGELOG.md
          else
            {
              echo "# Changelog"
              echo ""
              echo "All notable changes to **NVM - Node Visual Manager** will be documented in this file."
              echo ""
              echo "The format is based on [Keep a Changelog](https://keepachangelog.com/), and this project adheres to [Semantic Versioning](https://semver.org/)."
              echo ""
              cat /tmp/changelog_section.md
            } > CHANGELOG.md
          fi

          echo "--- CHANGELOG.md ---"
          cat CHANGELOG.md

      - name: Commit version + changelog, push tag and main
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit --allow-empty -m "chore: release v${VERSION}"
          git tag -f "v${VERSION}"
          git push --force origin "refs/tags/v${VERSION}"
          git push origin HEAD:"$DEFAULT_BRANCH" \
            || echo "::warning::main could not be updated. Tag v${VERSION} and release will continue."

  build:
    name: Build VSIX
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package VSIX
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-visual-manager-${{ needs.prepare.outputs.version }}
          path: '*.vsix'
          if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}
          fetch-depth: 0

      - name: Generate release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          EXTRA_NOTES: ${{ github.event.inputs.notes }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)

          {
            echo "## What's Changed"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges
            else
              git log --pretty=format:"- %s (%h)" --no-merges
            fi
            echo ""
            if [ -n "$EXTRA_NOTES" ]; then
              echo "---"
              echo ""
              echo "$EXTRA_NOTES"
              echo ""
            fi
            echo "## Installation"
            echo ""
            echo "1. Download the \`.vsix\` file from this release"
            echo "2. Open VS Code → Extensions → ⋯ → Install from VSIX"
            echo "3. Select the downloaded \`.vsix\` file"
          } > /tmp/release-notes.md

          echo "--- Release Notes ---"
          cat /tmp/release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: NVM - Node Visual Manager v${{ needs.prepare.outputs.version }}
          body_path: /tmp/release-notes.md
          files: artifacts/*.vsix
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
